name: Tests

on: 
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly

env:
  JOBS: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.10
      options: --user root
    steps:
      - name: Check Out
        uses: actions/checkout@v2
      - name: Install prerequisites
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends make
          # `pkg_resources` (imported by sphinxcontrib-jupyter) was removed from
          # setuptools in v81, so pin below that to keep it available.
          sage -pip install --upgrade "setuptools<81" pytest pytest-xdist traitlets nbmake nbclient sphinxcontrib-jupyter sphinx
      - name: Test
        run: |
          # `sage -sh` sets up Sage's environment (PATH, PYTHONPATH, its own
          # Python interpreter), which is what the tests need.
          sage -sh -c "
            cd \"\$GITHUB_WORKSPACE\"
            export DOT_SAGE=\$HOME/.sage/
            export PYTHONPATH=\"\$GITHUB_WORKSPACE\"
            # make jupyter notebooks
            make jupyter
            # We have to manually copy over those notebooks we want check
            cp docs/_build/jupyter/prompt.ipynb .
            cp docs/_build/jupyter/algorithms/*.ipynb .
            # sage wants it
            mkdir -p /usr/share/sagemath/build/pkgs
            # run tests in parallel (xdist)
            PYTHONIOENCODING=UTF-8 python -m pytest -n $JOBS
          "
          
